name: CI + Deploy + Smoke Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Enable corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Deploy to Vercel
        id: deployment
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          scope: ${{ secrets.VERCEL_SCOPE || '' }}

      - name: Smoke test preview (health + draft)
        env:
          BASE_URL: ${{ steps.deployment.outputs.preview-url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          echo "BASE_URL=$BASE_URL"

          # Health endpoint
          curl -fsS -H "x-vercel-protection-bypass: $BYPASS" "$BASE_URL/api/health"

          # Draft endpoint
          curl -fsS -H "x-vercel-protection-bypass: $BYPASS" \
            -H "Content-Type: application/json" \
            -d '{"notes":"Student improving in group work; needs help starting writing.","tone":"warm","language":"en","dev":true}' \
            "$BASE_URL/api/draft/generate" | jq .
