name: Draft Quality Integration

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  draft-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL_PRIMARY: ${{ vars.OPENAI_MODEL_PRIMARY || 'gpt-4.1-mini' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate integration secrets
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is required for live draft-quality integration tests."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run live draft-quality integration tests
        run: pnpm vitest run tests/integration/
